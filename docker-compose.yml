services:

  frontend:
    build: ./frontend
    image: ft_pinterest_frontend:latest
    container_name: ft_pinterest_frontend
    restart: always
    env_file:
      - ./frontend/.env
    expose:
      - "5173"
    networks:
      - ft_pinterest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend:
    build: ./backend
    image: ft_pinterest_backend:latest
    container_name: ft_pinterest_backend
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "3000"
    depends_on:
      - postgres
    networks:
      - ft_pinterest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: ft_pinterest_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    expose:
      - "5432"
    networks:
      - ft_pinterest-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: ft_pinterest_nginx
    restart: always
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - ft_pinterest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:8443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ft_pinterest-network:

volumes:
  postgres_data:
