services:

  frontend:
    build: ./frontend
    image: ft_pinterest_frontend:latest
    container_name: ft_pinterest_frontend
    restart: always
    env_file:
      - ./frontend/.env
    expose:
      - "5173"
    networks:
      - ft_pinterest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend:
    build: ./backend
    image: ft_pinterest_backend:latest
    container_name: ft_pinterest_backend
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ft_pinterest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: ft_pinterest_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    expose:
      - "5432"
    networks:
      - ft_pinterest-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    container_name: ft_pinterest_backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ft_pinterest-network
    healthcheck:
      test: ["CMD", "pidof", "supercronic"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: ft_pinterest_nginx
    restart: always
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - ft_pinterest-network
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: ft_pinterest_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ft_pinterest-network

networks:
  ft_pinterest-network:

volumes:
  postgres_data:
