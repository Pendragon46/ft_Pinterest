global:
  resolve_timeout: 5m

route:
  receiver: webhook
  group_by: ['alertname']
  group_wait: 0s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: webhook
    webhook_configs:
      # Placeholder endpoint — set your own webhook here. Never commit a real,
      # publicly-addressable URL (the previous webhook.site link leaked alerts).
      - url: http://127.0.0.1:9095/
        send_resolved: true